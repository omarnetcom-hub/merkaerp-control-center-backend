services:
  - type: web
    name: merka-control-center-backend
    env: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: DB_CREDENTIAL_SECRET
        sync: false
      # Existing MerkaERP 1.2.1+5 RS256 publisher private key.
      # Its public SPKI SHA-256 MUST equal the fingerprint pinned by MerkaERP.
      - key: JWT_PRIVATE_KEY_BASE64
        sync: false
      - key: ADMIN_ALLOWED_ORIGINS
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: REMOTE_ACCESS_ENABLED
        value: "false"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
